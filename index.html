<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لمة | المافيا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffc20f;--ink:#1f1f21;--card:#fff;--hd:#1f1f21;--hdt:#fff;--mut:#6b6b6b;--on:#1f1f21;--ont:#ffc20f;--bad:#d93025;--ok:#1e8e3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120a;--ink:#f5f1e6;--card:#24211a;--hd:#0c0a06;--hdt:#fff;--mut:#a9a394;--on:#ffc20f;--ont:#1f1f21;--bad:#ff6b5e;--ok:#5fd37f}}
:root[data-theme="dark"]{--bg:#15120a;--ink:#f5f1e6;--card:#24211a;--hd:#0c0a06;--hdt:#fff;--mut:#a9a394;--on:#ffc20f;--ont:#1f1f21;--bad:#ff6b5e;--ok:#5fd37f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;min-height:100%}
.hd{background:var(--hd);color:var(--hdt);text-align:center;padding:20px 16px;border-radius:0 0 28px 28px;font-weight:900;font-size:24px;border-bottom:3px solid #000}
.wrap{max-width:520px;margin:auto;padding:16px 16px 40px}
h2{font-size:22px;margin:8px 0 12px}h2 small{color:var(--mut);font-size:14px;font-weight:500}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border:3px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink)}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:19px;padding:14px;margin:12px 0 0;border:3px solid var(--ink);border-radius:18px;background:var(--on);color:var(--ont);cursor:pointer}
.btn.sm{width:56px;margin:0;font-size:26px;padding:0}
.btn.alt{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700}
.chip b{margin-inline-start:8px;color:var(--bad);cursor:pointer}
.chip.dead{opacity:.45;text-decoration:line-through}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:700;font-size:17px}
.set+.set{border-top:2px dashed var(--mut)}
.st button{font:inherit;font-weight:900;width:38px;height:38px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:20px}
.st b{display:inline-block;min-width:34px;text-align:center;font-size:20px}
.tg{font:inherit;font-weight:900;padding:6px 16px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.tg.on{background:var(--on);color:var(--ont)}
.center{text-align:center}.mut{color:var(--mut)}
.big{font-size:44px;font-weight:900;margin:18px 0}
.role{font-size:80px;margin:6px 0}.rn{font-size:34px;font-weight:900}
.say{font-size:20px;font-weight:700;margin:6px 0 12px;line-height:1.7}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-weight:700;font-size:17px;padding:12px 6px;border:3px solid var(--ink);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.on{background:var(--on);color:var(--ont)}
.res{font-size:24px;font-weight:900;text-align:center;margin:12px 0 0}
table{width:100%;border-collapse:collapse;font-weight:700}th,td{padding:8px 4px;text-align:center;border-bottom:2px dashed var(--mut)}
</style>
<meta name="theme-color" content="#ffc20f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لمة المافيا">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="app"></div>
<script>
var ROLES={mafia:{n:'المافيا',e:'🕴️',d:'اقتلوا مواطنًا كل ليلة دون أن ينكشف أمركم.'},doctor:{n:'الطبيب',e:'🩺',d:'كل ليلة أنقذ شخصًا واحدًا من القتل.'},detective:{n:'المحقق',e:'🕵️',d:'كل ليلة اكشف هل شخص ما من المافيا أم لا.'},citizen:{n:'مواطن',e:'🙂',d:'ناقش وصوّت لتكشف المافيا قبل فوات الأوان.'}};
var KEY='lamma_mafia_v1',app=document.getElementById('app');
var S={names:[],set:{m:null,doc:true,det:true,rev:true},h:{},w:{mafia:0,citizens:0}},G=null,V='home',arm=false;
try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');if(o.names)S=o}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function autoM(n){return n<=6?1:n<=9?2:3}
function maxM(n){return Math.max(1,Math.floor((n-1)/2))}
function mc(){var v=S.set.m==null?autoM(S.names.length):S.set.m;return Math.min(v,maxM(S.names.length))}

/* توزيع عادل: كل لاعب يأخذ درجة حسب كم مرة أخذ هذا الدور سابقًا + هل كان آخر دور له نفس الدور + عشوائية */
function deal(){
  var n=S.names,pool=n.slice(),asg={};
  var slots=[];for(var k=0;k<mc();k++)slots.push('mafia');
  if(S.set.det)slots.push('detective');
  if(S.set.doc)slots.push('doctor');
  slots.forEach(function(r){
    var best=null,bs=1e9;
    pool.forEach(function(p){
      var h=S.h[p]||{g:0};
      var sc=(h[r]||0)/(h.g+1)*10+(h.last===r?8:0)+(h.last&&h.last!=='citizen'?3:0)+Math.random()*3;
      if(sc<bs){bs=sc;best=p}
    });
    asg[best]=r;pool.splice(pool.indexOf(best),1);
  });
  pool.forEach(function(p){asg[p]='citizen'});
  n.forEach(function(p){var h=S.h[p]=S.h[p]||{g:0};h.g++;h[asg[p]]=(h[asg[p]]||0)+1;h.last=asg[p]});
  G={pl:n.map(function(p){return{n:p,r:asg[p],a:1}}),i:0,show:0,day:1,step:'sleep',sel:null,chk:null,kill:null,save:null,msg:'',w:null,has:{doctor:S.set.doc,detective:S.set.det}};
  save();
}
function chk(){
  var m=G.pl.filter(function(x){return x.a&&x.r==='mafia'}).length,o=G.pl.filter(function(x){return x.a&&x.r!=='mafia'}).length;
  return m===0?'citizens':(m>=o?'mafia':null);
}
function alive(r){return G.pl.some(function(x){return x.a&&x.r===r})}
function idx(f){var a=[];G.pl.forEach(function(x,i){if(x.a&&f(x))a.push(i)});return a}
var ORDER=['sleep','mafia','doctor','detective','dawn'];
function nxt(){if(G.step==='sleep')return 'night';
  var i=ORDER.indexOf(G.step)+1;
  while(i<ORDER.length-1){var s=ORDER[i];if(s==='doctor'&&!G.has.doctor||s==='detective'&&!G.has.detective)i++;else break}
  return ORDER[i];
}
function who(i){var x=G.pl[i];return '<b>'+esc(x.n)+'</b>'+(S.set.rev?' (كان '+ROLES[x.r].n+')':'')}
function calcDawn(){
  var k=G.kill,s=G.save;
  if(k!=null&&k!==s){G.pl[k].a=0;G.msg='☀️ طلع الصباح... وللأسف مات الليلة '+who(k)}
  else G.msg='☀️ طلع الصباح... ما حدا مات الليلة 🎉';
  G.w=chk();G.step='dawn';
}

/* تثبيت التطبيق (PWA) */
var DP=null,STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();DP=e;if(V==='home')render()});
window.addEventListener('appinstalled',function(){DP=null;STANDALONE=true;if(V==='home')render()});
function instBtn(){
  if(STANDALONE)return '<p class="mut" style="text-align:center;margin-top:16px">✅ التطبيق مثبّت على جهازك</p>';
  return '<button class="btn alt" data-a="inst">📲 تثبيت التطبيق</button>';
}
function instHelp(){
  var ua=navigator.userAgent||'';
  if(!/^https?:$/.test(location.protocol))return 'التثبيت يحتاج أن تفتح اللعبة من رابط https (مثل GitHub Pages)، وليس من ملف على الجوال.';
  if(/iphone|ipad|ipod/i.test(ua))return 'على الآيفون: افتح الرابط في Safari، اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».';
  return 'من قائمة المتصفح (⋮) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». إذا لم يظهر الخيار، أعد تحميل الصفحة مرة وانتظر ثوانٍ.';
}
function vHome(){
  var n=S.names.length,ok=n>=5&&n<=12,t=function(k,l){return '<div class="set"><span>'+l+'</span><button class="tg '+(S.set[k]?'on':'')+'" data-a="tg" data-k="'+k+'">'+(S.set[k]?'مفعّل':'متوقف')+'</button></div>'};
  return '<div class="hd">لمة | المافيا</div><div class="wrap"><h2>اللاعبون ('+n+') <small>5-12</small></h2>'+
  '<div class="row"><input id="nm" placeholder="اكتب اسم لاعب" maxlength="14"><button class="btn sm" data-a="add">+</button></div>'+
  '<div class="chips">'+S.names.map(function(p,i){return '<span class="chip">'+esc(p)+'<b data-a="del" data-i="'+i+'">✕</b></span>'}).join('')+'</div>'+
  '<div class="card"><div class="set"><span>عدد المافيا</span><span class="st"><button data-a="m" data-i="-1">−</button><b>'+mc()+'</b><button data-a="m" data-i="1">+</button></span></div>'+
  t('doc','🩺 الطبيب')+t('det','🕵️ المحقق')+t('rev','كشف دور من يخرج')+'</div>'+
  '<button class="btn" data-a="start" '+(ok?'':'disabled')+'>'+(ok?'وزّع الأدوار 🎲':'أضف 5 لاعبين على الأقل')+'</button>'+
  '<button class="btn alt" data-a="res">📊 النتائج</button>'+instBtn()+'</div>';
}
function bar(){var b=function(a,l){return '<button class="btn alt" style="margin:0;font-size:14px;padding:10px 4px" data-a="'+a+'">'+l+'</button>'};return '<div class="row" style="margin-top:20px">'+b('home','✏️ الأسماء')+b('newg',arm==='newg'?'تأكيد ⚠️':'🔄 جديدة')+b('fin',arm==='fin'?'تأكيد ⚠️':'🏁 إنهاء')+'</div>'}
function vReveal(){return vReveal0().replace(/<\/div>$/,bar()+'</div>')}
function vReveal0(){
  var p=G.pl[G.i],last=G.i===G.pl.length-1,h='<div class="hd">توزيع الأدوار</div><div class="wrap center">';
  if(!G.show)return h+'<p class="mut">اللاعب '+(G.i+1)+' من '+G.pl.length+'</p><p class="say">سلّم الجوال إلى</p><div class="big">'+esc(p.n)+'</div><button class="btn" data-a="show">اضغط لرؤية دورك 👁️</button></div>';
  var R=ROLES[p.r],m='';
  if(p.r==='mafia'){var t=G.pl.filter(function(x){return x.r==='mafia'&&x!==p}).map(function(x){return esc(x.n)});m='<p class="say">'+(t.length?'🕴️ زملاؤك: '+t.join('، '):'أنت المافيا الوحيد 😈')+'</p>'}
  return h+'<div class="card"><div class="role">'+R.e+'</div><div class="rn">'+R.n+'</div><p class="say">'+R.d+'</p>'+m+'</div><button class="btn" data-a="hide">'+(last?'ابدأ اللعبة 🌙':'أخفِ وسلّم للتالي')+'</button></div>';
}
function vGame(){
  var night=['sleep','night','mafia','doctor','detective'].indexOf(G.step)>-1;
  var h='<div class="hd">'+(night?'الليلة ':'النهار ')+G.day+(night?' 🌙':' ☀️')+'</div><div class="wrap">';
  h+='<div class="chips">'+G.pl.map(function(x){return '<span class="chip '+(x.a?'':'dead')+'">'+esc(x.n)+(x.a?'':' 💀')+'</span>'}).join('')+'</div>';
  var c=function(t,b){return '<div class="card"><p class="say">'+t+'</p>'+(b||'')+'</div>'};
  var list=function(a,extra){return '<div class="opts">'+a.map(function(i){return '<button class="opt '+(G.sel===i?'on':'')+'" data-a="sel" data-i="'+i+'">'+esc(G.pl[i].n)+'</button>'}).join('')+(extra||'')+'</div>'};
  var go=function(s,l,d){return '<button class="btn" data-a="go" data-s="'+s+'" '+(d?'disabled':'')+'>'+l+'</button>'};
  var s=G.step;
  if(s==='night'){var q=G.nq,P=G.pl[q[G.nk]],nm=esc(P.n);
    var nx=function(){return '<button class="btn" data-a="nnext">التالي ➡️</button>'};
    var ok=function(d,a){return '<button class="btn" data-a="'+a+'" '+(d?'disabled':'')+'>تأكيد الاختيار ✅</button>'};
    if(G.nsh===0)h+=c('🌙 سلّم الجوال إلى<div class="big">'+nm+'</div>','<button class="btn" data-a="nstart">أنا '+nm+'، أظهر دوري 👁️</button>');
    else if(P.r==='citizen')h+=c('🙂 أنت مواطن، لا شيء تفعله الليلة. اضغط التالي وسلّم الجوال.',nx());
    else if(P.r==='mafia'){
      if(G.nsh===1)h+=c('🕴️ مَن تريد قتله الليلة؟'+G.mv.map(function(x){return '<br><span class="mut">زميلك '+esc(G.pl[x.p].n)+' اختار: <b>'+esc(G.pl[x.t].n)+'</b></span>'}).join(''),list(idx(function(x){return x.r!=='mafia'}))+ok(G.sel==null,'mcast'));
      else{var mn=q.filter(function(i){return G.pl[i].r==='mafia'}).length,ex='';if(G.mv.length===mn)ex=G.mv.every(function(x){return x.t===G.mv[0].t})?'<br>✅ اتفقتم على نفس الضحية':'<br>❌ ما اتفقتم، لذلك ما حدا سيموت الليلة';h+=c('✅ تم تسجيل اختيارك'+ex,nx())}
    }
    else if(P.r==='doctor'){if(G.nsh===1)h+=c('🩺 مَن تنقذ الليلة؟',list(idx(function(){return 1}))+ok(G.sel==null,'dcast'));else h+=c('✅ تم تسجيل اختيارك',nx())}
    else{var L=G.chk!=null;h+=c('🕵️ مَن تشك فيه؟<br><span class="mut">اختر اسمًا، وبعد ما تتأكد اضغط اكشف. مرة واحدة فقط.</span>',list(idx(function(x){return x!==P}))+(L?'<p class="res">'+esc(G.pl[G.chk].n)+': '+(G.pl[G.chk].r==='mafia'?'✅ مافيا':'❌ ليس مافيا')+'</p>'+nx():'<button class="btn" data-a="chk" '+(G.sel==null?'disabled':'')+'>🔍 اكشف (مرة واحدة فقط)</button>'))}
  }
  else if(s==='sleep')h+=c('🌙 سيمرّ الجوال على كل اللاعبين الأحياء بالترتيب، حتى المواطنين، حتى لا يُعرف دور أحد.',go(nxt(),'ابدأ الليلة'));
  else if(s==='mafia')h+=c('🕴️ المافيا تفتح عيونها وتتفق بالإشارة على ضحية',list(idx(function(x){return x.r!=='mafia'}))+go(nxt(),'المافيا تنام',G.sel==null));
  else if(s==='doctor'){var a=alive('doctor');h+=c('🩺 الطبيب يفتح عينيه: مَن تنقذ الليلة؟'+(a?'':'<br><span class="mut">الطبيب خارج اللعبة، انتظر بضع ثوانٍ بصمت كأنه يختار.</span>'),(a?list(idx(function(){return 1})):'')+go(nxt(),'الطبيب ينام',a&&G.sel==null))}
  else if(s==='detective'){var d=alive('detective'),L=G.chk!=null;h+=c('🕵️ المحقق يفتح عينيه: مَن تشك فيه؟'+(d?'':'<br><span class="mut">المحقق خارج اللعبة، انتظر بضع ثوانٍ بصمت.</span>'),(d?list(idx(function(x){return x.r!=='detective'}))+(L?'<p class="res">'+esc(G.pl[G.chk].n)+': '+(G.pl[G.chk].r==='mafia'?'✅ مافيا':'❌ ليس مافيا')+'</p><p class="mut center">أشِر له بإبهامك فقط (👍 مافيا / 👎 لا)</p>':'<button class="btn" data-a="chk" '+(G.sel==null?'disabled':'')+'>🔍 اكشف (مرة وحدة فقط)</button>'):'')+go('dawn','المحقق ينام، اطلع الصباح ☀️',d&&!L))}
  else if(s==='vote'){var vt=G.vt;
    if(vt.k<vt.q.length){var v=vt.q[vt.k];h+=c('🗳️ دور <b>'+esc(G.pl[v].n)+'</b>: سلّم الجوال له ليصوّت سرًا ('+(vt.k+1)+'/'+vt.q.length+')<br><span class="mut">مَن تشك أنه من المافيا؟</span>',list(idx(function(x){return x!==G.pl[v]}))+'<div class="opts" style="margin-top:10px"><button class="opt '+(G.sel===-1?'on':'')+'" data-a="sel" data-i="-1">امتناع عن التصويت</button></div><button class="btn" data-a="cast" '+(G.sel==null?'disabled':'')+'>تأكيد صوتي ✅</button>')}
    else{var tr=vt.q.slice().sort(function(a,b){return (vt.t[b]||0)-(vt.t[a]||0)}).map(function(j){return '<tr><td>'+esc(G.pl[j].n)+'</td><td>'+(vt.t[j]||0)+' 🗳️</td></tr>'}).join('');h+=c('📊 نتيجة التصويت','<table>'+tr+'</table>'+go('out','تأكيد النتيجة'))}}
  else if(s==='dawn')h+=c(G.msg,G.w?go('end','شوف النتيجة 🏆'):go('vote','ابدأ النقاش والتصويت 🗣️'));
  else if(s==='vote')h+=c('🗣️ ناقشوا وصوّتوا: مَن يخرج من اللعبة؟',list(idx(function(){return 1}),'<button class="opt '+(G.sel===-1?'on':'')+'" data-a="sel" data-i="-1">ما حدا (تعادل)</button>')+go('out','تأكيد التصويت',G.sel==null));
  else if(s==='out')h+=c(G.msg,G.w?go('end','شوف النتيجة 🏆'):go('sleep','ابدأ الليلة التالية 🌙'));
  h+='<div class="row" style="margin-top:20px"><button class="btn alt" style="margin:0;font-size:16px" data-a="fin">'+(arm==='fin'?'اضغط للتأكيد ⚠️':'🏁 إنهاء اللعبة')+'</button><button class="btn alt" style="margin:0;font-size:16px" data-a="newg">'+(arm==='newg'?'اضغط للتأكيد ⚠️':'🔄 لعبة جديدة')+'</button></div>';
  return h+'</div>';
}
function vEnd(){
  var m=G.w==='mafia';
  return '<div class="hd">'+(!G.w?'🏁 انتهت اللعبة':m?'🕴️ فازت المافيا!':'🎉 فاز المواطنون!')+'</div><div class="wrap"><div class="card"><table>'+G.pl.map(function(x){return '<tr><td>'+ROLES[x.r].e+' '+ROLES[x.r].n+'</td><td>'+esc(x.n)+'</td><td>'+(x.a?'حي':'💀')+'</td></tr>'}).join('')+'</table></div>'+
  '<button class="btn" data-a="again">🔀 جولة جديدة (توزيع جديد)</button><button class="btn alt" data-a="home">تعديل الأسماء</button><button class="btn alt" data-a="res">📊 النتائج</button></div>';
}
function vRes(){
  var rows=Object.keys(S.h).filter(function(p){return S.names.indexOf(p)>-1}).map(function(p){var h=S.h[p];return '<tr><td>'+esc(p)+'</td><td>'+(h.mafia||0)+'</td><td>'+(h.detective||0)+'</td><td>'+(h.doctor||0)+'</td><td>'+(h.citizen||0)+'</td></tr>'}).join('');
  return '<div class="hd">النتائج</div><div class="wrap"><div class="card center"><p class="say">🕴️ فوز المافيا: '+S.w.mafia+' &nbsp;|&nbsp; 🎉 فوز المواطنين: '+S.w.citizens+'</p></div>'+
  '<div class="card"><p class="say">كم مرة أخذ كل لاعب كل دور</p><table><tr><th>اللاعب</th><th>🕴️</th><th>🕵️</th><th>🩺</th><th>🙂</th></tr>'+(rows||'<tr><td colspan="5" class="mut">لا توجد جولات بعد</td></tr>')+'</table></div>'+
  '<button class="btn alt" data-a="rst">'+(arm==='rst'?'اضغط مرة ثانية للتأكيد ⚠️':'تصفير النتائج')+'</button><button class="btn" data-a="home">رجوع</button></div>';
}
function render(){
  app.innerHTML=({home:vHome,reveal:vReveal,game:vGame,end:vEnd,res:vRes})[V]();
  window.scrollTo(0,0);
}
function add(){
  var el=document.getElementById('nm'),v=el.value.trim();
  if(v&&S.names.length<12&&S.names.indexOf(v)<0){S.names.push(v);save()}
  render();document.getElementById('nm').focus();
}
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='nm')add()});
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,i=+t.dataset.i,pa=arm;if(a!=='fin'&&a!=='newg'&&a!=='rst')arm='';
  if(a==='inst'){if(DP){var d=DP;DP=null;d.prompt();d.userChoice.then(function(){render()})}else alert(instHelp());return}
  if(a==='add')return add();
  if(a==='del'){S.names.splice(i,1);save()}
  else if(a==='m'){S.set.m=Math.max(1,Math.min(maxM(S.names.length),mc()+i));save()}
  else if(a==='tg'){S.set[t.dataset.k]=!S.set[t.dataset.k];save()}
  else if(a==='start'||a==='again'){deal();V='reveal'}
  else if(a==='show')G.show=1;
  else if(a==='hide'){G.show=0;G.i++;if(G.i>=G.pl.length)V='game'}
  else if(a==='sel'){if(!(G.step==='night'&&G.chk!=null))G.sel=i}
  else if(a==='chk')G.chk=G.sel;
  else if(a==='nstart'){G.nsh=1;G.sel=null}
  else if(a==='mcast'){G.mv.push({p:G.nq[G.nk],t:G.sel});G.sel=null;G.nsh=2}
  else if(a==='dcast'){G.save=G.sel;G.sel=null;G.nsh=2}
  else if(a==='nnext'){G.nk++;G.nsh=0;G.sel=null;G.chk=null;if(G.nk>=G.nq.length){var m=G.mv;G.kill=(m.length&&m.every(function(x){return x.t===m[0].t}))?m[0].t:null;calcDawn()}}
  else if(a==='cast'){var vt=G.vt;if(G.sel!==-1)vt.t[G.sel]=(vt.t[G.sel]||0)+1;vt.k++;G.sel=null;if(vt.k>=vt.q.length){var mx=0,wn=[];vt.q.forEach(function(j){var n=vt.t[j]||0;if(n>mx){mx=n;wn=[j]}else if(n===mx&&n>0)wn.push(j)});vt.res=(wn.length===1&&mx>0)?wn[0]:-1}}
  else if(a==='go'){
    var s=t.dataset.s,cur=G.step;
    if(cur==='mafia')G.kill=G.sel;
    else if(cur==='doctor')G.save=G.sel;
    if(cur==='vote'){
      var r=G.vt.res;if(r>=0){G.pl[r].a=0;G.msg='🗳️ قرّر الجميع إخراج '+who(r)}
      else G.msg='🗳️ تعادل الأصوات، ما حدا طلع اليوم';
      G.w=chk();
    }
    if(cur==='out'){G.day++;G.kill=null;G.save=null;G.chk=null}
    G.sel=null;
    if(s==='end'){S.w[G.w]++;save();V='end'}
    else if(s==='dawn')calcDawn();
    else{if(s==='night'){G.nq=idx(function(){return 1});G.nk=0;G.nsh=0;G.mv=[];G.kill=null;G.save=null;G.chk=null}if(s==='vote')G.vt={q:idx(function(){return 1}),k:0,t:{}};G.step=s}
  }
  else if(a==='home')V='home';
  else if(a==='res')V='res';
  else if(a==='fin'){if(pa!=='fin')arm='fin';else{arm='';G.w=null;V='end'}}
  else if(a==='newg'){if(pa!=='newg')arm='newg';else{arm='';deal();V='reveal'}}
  else if(a==='rst'){if(pa!=='rst')arm='rst';else{S.h={};S.w={mafia:0,citizens:0};save();arm=''}}
  render();
});
render();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
</script>
